plugins {
    id 'java'
    id "com.gradleup.shadow" version "9.3.0"
    //id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3' apply false
}

version = project.mod_version

configurations {
    implementation.extendsFrom shade
}

repositories {
    maven { url "https://maven.hytale.com/pre-release" }
    maven { url "https://maven.hytale.com/release" }
    maven { url "https://cursemaven.com" }

    flatDir {
        dirs("libs")
    }
}

dependencies {
    implementation 'com.hypixel.hytale:Server:0.5.0'

}

shadowJar {
    configurations = [project.configurations.shade]
    mergeServiceFiles()
}


processResources {
    var expandProps = [
            'name'       : project.name,
            'version'    : project.mod_version,
            'server_version': project.hytale_version,
            'group'      : project.group
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
}

import org.gradle.internal.os.OperatingSystem
def getHytaleAssetsPath() {
    def os = OperatingSystem.current()
    def assetsPath

    if (os.isWindows()) {
        assetsPath = System.getenv("APPDATA") + "\\Hytale\\install\\release\\package\\game\\latest\\Assets.zip"
    } else if (os.isMacOsX()) {
        assetsPath = System.getProperty("user.home") + "/Library/Application Support/Hytale/install/release/package/game/latest/Assets.zip"
    } else if (os.isLinux()) {
        def flatpakPath = System.getProperty("user.home") + "/.var/app/com.hypixel.HytaleLauncher/data/Hytale/install/release/package/game/latest/Assets.zip"
        def flatpakFile = file(flatpakPath)
        if (flatpakFile.exists()) {
            assetsPath = flatpakPath
        } else {
            assetsPath = System.getProperty("user.home") + "/.local/share/Hytale/install/release/package/game/latest/Assets.zip"
        }
    } else {
        throw new GradleException("Unsupported operating system: $os")
    }

    return file(assetsPath)
}

def serverRunDir = file("$projectDir/run")

tasks.register('runServer', JavaExec) {
    group = "application"
    description = "Run the Hytale server with local mods"

    mainClass = 'com.hypixel.hytale.Main'
    classpath = sourceSets.main.runtimeClasspath

    def modsDir = sourceSets.main.output.resourcesDir ?: file("$buildDir/resources/main")

    args = [
            "--allow-op",
            "--disable-sentry",
            "--assets=${getHytaleAssetsPath().absolutePath}",
            "--mods=${modsDir.absolutePath}",
            "--auth-mode=authenticated"
    ]

    workingDir = serverRunDir
    standardInput = System.in

    dependsOn processResources

    doFirst {
        serverRunDir.mkdirs()
        if (!getHytaleAssetsPath().exists()) {
            println "Warning: Assets.zip not found at ${getHytaleAssetsPath()}"
        }
    }
}
